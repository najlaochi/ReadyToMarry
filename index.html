  learn:[
   {q:'في كتاب «الرجال من المريخ والنساء من الزهرة»، «الكهف» يعني:',o:['مكاناً لإخفاء المال','حاجة الرجل إلى الانسحاب والتفكير بهدوء عند الضغط قبل أن يتكلم','حاجة المرأة إلى الهدوء'],a:1,e:'كثير من الرجال يعالجون الضغط وحدهم أولاً، والرد اللطيف هو منح الوقت لا الملاحقة. وقد استقبلت خديجة رضي الله عنها النبي ﷺ بعد غار حراء بالطمأنينة والتثبيت، لا بالضغط.'},
   {q:'عندما تشارك المرأة مشكلة، فهي غالباً تريد أولاً:',o:['حلاً فورياً','أن تُسمَع وتُفهَم','أن تُترك وحدها'],a:1,e:'الإصغاء قبل الإصلاح. وقد استمع النبي ﷺ لحديث عائشة الطويل عن النساء الإحدى عشرة (حديث أم زرع، رواه البخاري) حتى نهايته، ثم أجابها بلطف.'},
   {q:'ماذا تقول الأبحاث عن هذه الفروق؟',o:['الرجال والنساء مختلفون تماماً','الرجال والنساء متشابهون أكثر مما هم مختلفون، وأفكار الكتاب ميول لا قواعد','لا توجد فروق أبداً'],a:1,e:'وجدت مراجعة عالمة النفس جانيت هايد لعدد كبير من الدراسات أن معظم الفروق النفسية بين الجنسين صغيرة. يُستفاد من الكتاب لفتح الحوار، ثم التعرّف على الشريك الحقيقي.'}],
  playH:[
   {who:'زوجتك',s:'تعود منزعجة من مديرتها وتبدأ بإخبارك بكل شيء.',o:[['«استقيلي وانتهى الأمر.»',0],['تستمع وأنت تتصفح هاتفك.',4],['تضع الهاتف جانباً، وتستمع حتى النهاية، ثم تسأل: «هل تريدين نصيحتي أم أن أستمع فقط؟»',15]],e:'كثير من النساء يتحدثن ليرتحن، لا ليحصلن على حلول. السؤال أولاً احترام لما تحتاجه.'},
   {who:'أسبوع ضاغط',s:'أنت تحت ضغط وتريد البقاء وحدك، وتسألك زوجتك: «ما بك؟»',o:[['«لا شيء!» وتغادر.',0],['تبقى لكن صامتاً.',5],['«ضغط في العمل. أحتاج ساعة لأفكر، ثم أنا معكِ تماماً.»',15]],e:'الذهاب إلى «كهفك» لا بأس به، أما الاختفاء دون كلمة فلا. أخبرها متى ستعود.'}],
  playW:[
   {who:'زوجك',s:'يعود متوتراً ويصمت في غرفة أخرى.',o:[['تلحقين به: «كلّمني الآن!»',0],['تشعرين بالرفض وتعبسين طوال المساء.',4],['تمنحينه مساحة، ثم تقولين لاحقاً: «أنا هنا عندما تكون مستعداً.»',15]],e:'كثير من الرجال ينسحبون ليفكروا ثم يعودون. المساحة مع الدفء تعيده أسرع من الضغط.'},
   {who:'زوجك',s:'تخبرينه عن يومك الصعب، فيعطيك فوراً قائمة من الحلول.',o:[['«أنت لا تفهمني أبداً!»',0],['تتوقفين عن الكلام وتحتفظين بالأمر لنفسك.',4],['تبتسمين: «شكراً لك. الآن أحتاج فقط أن تستمع إليّ.»',15]],e:'هو يحاول المساعدة بطريقته، فقولي بوضوح ما تحتاجين. وكثير من الرجال يشعرون بالحب أكثر عندما تُقدَّر جهودهم.'}],
  mission:'اختر تحدياً من المريخ والزهرة لهذا الأسبوع:',
  missionOptsH:['اسأل: «هل تريدين نصيحة أم استماعاً فقط؟» قبل أن ترد على أي مشكلة.','قدّم لفتة صغيرة لطيفة كل يوم: رسالة، أو مشروبها المفضل، أو مديح.','عندما تحتاج إلى مساحة، قل كم من الوقت، وعد في موعدك.','استمع لأحد أفراد عائلتك 10 دقائق دون أن تقدّم حلاً واحداً.'],
  missionOptsW:['قولي بالضبط ما تحتاجين بدلاً من التلميح.','اشكريه بصوت مسموع على جهد واحد كل يوم، ولو كان صغيراً.','عندما يصمت، امنحيه مساحة وكلمة دافئة واحدة.','اطلبي رأيه في أمر ما، واشكريه عليه.'],
  hus:'استمع قبل أن تصلح، وادخل كهفك لكن أعلن ذلك، وقدّم لفتات صغيرة باستمرار.', wif:'احترمي كهفه، وقولي ما تحتاجين بوضوح، وقدّري جهوده.'},
 {name:'عقد الزواج', prob:'الحقوق والمهر والشروط والقانون',
  mirrorH:[['أعرف المهر الذي أستطيع دفعه بصدق دون قرض.',5],['لا مانع عندي أن تكتب شروطاً في العقد.',5],['الحفل الكبير أهم عندي من بداية مستقرة.',1],['أنا مستعد لمشاركة نتائج الفحص الطبي قبل الزواج بصدق.',5],['أعرف أركان عقد النكاح الصحيح.',5]],
  mirrorW:[['أعرف أن المهر حقي وحدي، وفكرت فيما هو عادل وميسّر.',5],['أعرف الشروط التي أريد كتابتها في العقد (الدراسة، العمل، السكن).',5],['أقبل زواجاً سرياً أو غير موثق إن كان يحبني.',1],['أنا مستعدة لمشاركة نتائج الفحص الطبي قبل الزواج بصدق.',5],['أعرف أركان عقد النكاح الصحيح.',5]],
  learn:[
   {q:'أيّ هذه الأمور ليس شرطاً لصحة عقد النكاح؟',o:['رضا الزوجين الحر','شاهدان وولي الزوجة','حفل زفاف باهظ'],a:2,e:'يقوم العقد على الإيجاب والقبول، والرضا، والولي، والشاهدين، والمهر. «لا نكاح إلا بولي» (رواه أبو داود والترمذي). أما الحفل فليس شرطاً، والوليمة يمكن أن تكون بسيطة.'},
   {q:'المهر ملك لـ:',o:['والد العروس','العروس وحدها','الزوجين معاً'],a:1,e:'﴿وَآتُوا النِّسَاءَ صَدُقَاتِهِنَّ نِحْلَةً﴾ (النساء: 4). هو مالها. ويكون مقدّماً يُدفع عند العقد، ومؤخراً يُستحق لاحقاً، ويُكتب الجزءان.'},
   {q:'هل يحق للعروس أن تضيف شروطاً إلى العقد، مثل إكمال دراستها أو الاستمرار في عملها؟',o:['لا، الشروط غير جائزة','نعم، ما لم تُحلّ حراماً، ويجب الوفاء بها','الوعود الشفهية تكفي'],a:1,e:'«أحقّ الشروط أن توفوا به ما استحللتم به الفروج» (متفق عليه). اكتبوها بوضوح، فالوعد الشفهي يصعب إثباته لاحقاً.'},
   {q:'وفق قانون الأحوال الشخصية الإماراتي الجديد (المرسوم بقانون اتحادي رقم 41 لسنة 2024، النافذ منذ أبريل 2025)، سن الزواج المعتمد هو:',o:['15','16','18'],a:2,e:'يحدد القانون سن 18 للزواج. ويشترط موافقة المحكمة إذا زاد فارق السن على 30 سنة ولم يسبق للمرأة الزواج.'},
   {q:'لماذا الفحص الطبي قبل الزواج مطلوب في الإمارات؟',o:['مجرد أوراق','لكشف أمراض الدم الوراثية مثل الثلاسيميا وبعض الأمراض المعدية، ليقرر الزوجان عن علم','لتحديد من يدفع تكاليف الحفل'],a:1,e:'شهادة الفحص مطلوبة لتوثيق الزواج في محاكم الإمارات، وأُضيفت الفحوص الجينية للمواطنين منذ 2025. إذا كان الطرفان حاملين للصفة نفسها قد يولد طفل مريض، فاستشيرا مختصاً معاً.'},
   {q:'انتهت الخطبة قبل العقد. وفق القانون الإماراتي الجديد، أي الهدايا يمكن استردادها؟',o:['الورود والطعام والشوكولاتة','الهدايا الثمينة غير المستهلكة التي تزيد قيمتها على 25,000 درهم وقُدّمت بشرط الزواج','كل ما قُدّم'],a:1,e:'الهدايا المستهلكة لا تُسترد. والخطبة وعد لا زواج: ﴿وَلَا تَنسَوُا الْفَضْلَ بَيْنَكُمْ﴾ (البقرة: 237).'}],
  playH:[
   {who:'أهلها',s:'يطلب أهلها مهراً مرتفعاً جداً وحفلاً لـ600 ضيف، وستحتاج إلى قرض بنكي كبير.',o:[['تأخذ القرض، فهو يوم العمر.',0],['توافق ثم تشتكي من التكلفة سنوات.',3],['تشكرهم، وتشرح ميزانيتك بصدق، وتتفقون على مهر عادل ووليمة بسيطة مباركة.',15]],e:'«أعظم النكاح بركة أيسره مؤونة» (رواه أحمد). البداية بالدَّين ترهق السنوات الأولى.'},
   {who:'خطيبتك',s:'تطلب أن يُكتب في العقد أن تكمل دراسة الماجستير.',o:[['«ألا تثقين بي؟ لا شروط.»',0],['توافق شفهياً وترفض الكتابة.',4],['تتناقشان، وتوافق، وتكتبه بوضوح، وتنوي الوفاء به.',15]],e:'الشرط المكتوب يحميكما من سوء الفهم، والوفاء به من دينك.'},
   {who:'صديق',s:'يقترح صديق عقداً سريعاً عند شيخ في البيت، «ونوثقه لاحقاً».',o:[['توافق، فالتوثيق مجرد أوراق.',0],['تؤجل القرار ولا تفعل شيئاً.',5],['ترفض، وتوثّق الزواج في المحكمة بحضور وليها والشاهدين.',15]],e:'الزواج غير الموثق قد يترك الزوجة والأطفال بلا إثبات للزواج أو النسب أو الإقامة أو الإرث.'},
   {who:'العيادة',s:'أظهر الفحص أنكما تحملان صفة الثلاسيميا.',o:[['تخفي الأمر عن أهلها.',0],['تلغي كل شيء دون أن تكلمها.',3],['تجلسان معاً مع مستشار وراثي، وتفهمان المخاطر، وتقرران معاً.',15]],e:'الصدق قبل العقد يبني الثقة، والاستشارة تعطيكما أرقاماً وخيارات حقيقية.'},
   {who:'الخطبة',s:'أنتما مخطوبان والعقد بعد أشهر، وتريد أن تسافرا وحدكما في عطلة نهاية الأسبوع.',o:[['تسافران، فأنتما شبه متزوجين.',0],['تسافران سراً.',0],['تلتقيان بحضور الأهل، أو تقدّمان موعد العقد.',15]],e:'الخطبة وعد لا زواج، وهي ليست زوجتك قبل العقد.'}],
  playW:[
   {who:'أهلك',s:'يطلب أهلك مهراً مرتفعاً جداً «ليظهر قدرك»، وسيضطر إلى قرض كبير.',o:[['تصرّين، فهذا يدل على تقديره لك.',0],['تسكتين وتتركين القرار لهم.',4],['تتفقين معه على مهر مقدّم ومؤخر عادل، وتساعدين أهلك على رؤية بركة التيسير.',15]],e:'«أعظم النكاح بركة أيسره مؤونة» (رواه أحمد). قيمتك ليست رقماً، والزوج المديون زوج مرهق.'},
   {who:'دراستك',s:'تريدين إكمال الماجستير بعد الزواج، فيقول: «طبعاً، لا داعي للكتابة.»',o:[['تثقين بالوعد الشفهي.',3],['تتركين الموضوع.',0],['تشكرينه بلطف، وتكتبينه في العقد شرطاً.',15]],e:'«أحقّ الشروط أن توفوا به ما استحللتم به الفروج» (متفق عليه). الكتابة تحميكما معاً.'},
   {who:'خطيبك',s:'يقترح عقداً سرياً «حتى يوافق أهلي»، دون توثيق.',o:[['تقبلين لأنك تحبينه.',0],['تطلبين وقتاً وتتجنبين الموضوع.',5],['ترفضين: زواج بوليك وشاهدين وتوثيق في المحكمة، أو لا شيء.',15]],e:'الزواج غير الموثق قد يتركك وأطفالك بلا إثبات للزواج أو النسب أو الإقامة أو الإرث.'},
   {who:'العيادة',s:'أظهر الفحص أنكما تحملان صفة الثلاسيميا.',o:[['تخفين الأمر عن أهلك.',0],['تنهين الخطبة دون أن تكلميه.',3],['تذهبان معاً إلى مستشار وراثي، وتفهمان المخاطر، وتقرران معاً.',15]],e:'الصدق قبل العقد يبني الثقة، والاستشارة تعطيكما أرقاماً وخيارات حقيقية.'},
   {who:'الخطبة',s:'أنتما مخطوبان، ويطلب أن تسافري معه وحدكما قبل العقد.',o:[['تسافرين، فأنتما شبه متزوجين.',0],['تسافرين دون إخبار أحد.',0],['ترفضين بلطف: لقاء بحضور الأهل، أو تقديم موعد العقد.',15]],e:'الخطبة وعد لا زواج، وكرامتك وثقة أهلك أولاً.'}],
  mustsH:'قائمة العقد',
  musts:[['الرضا والولي','موافقة الزوجين بحرية، وحضور ولي الزوجة.'],['شاهدان','شاهدان بالغان عدلان عند العقد.'],['المهر مكتوباً','المقدّم والمؤخر مكتوبان بوضوح.'],['شروطكما','الدراسة أو العمل أو السكن أو أي اتفاق، مكتوباً في العقد.'],['الفحص والتوثيق','إجراء الفحص الطبي قبل الزواج، وتوثيق العقد في المحكمة.']],
  mission:'اختر خطوة للعقد هذا الأسبوع:',
  missionOptsH:['اكتب المهر الذي تستطيعه بصدق، مقدّماً ومؤخراً.','اسألها عن الشروط المهمة لها، واستمع دون حكم.','احجز موعد الفحص الطبي قبل الزواج.','اقرأ ملخص باب الزواج في قانون الأحوال الشخصية على u.ae.'],
  missionOptsW:['اكتبي الشروط التي تريدينها في عقدك.','اتفقي مع أهلك على مهر عادل ميسّر.','احجزي موعد الفحص الطبي قبل الزواج.','اقرئي ملخص باب الزواج في قانون الأحوال الشخصية على u.ae.'],
  hus:'قدّم مهراً صادقاً، واقبل الشروط المكتوبة، ووثّق الزواج، وأوفِ بكل وعد.', wif:'اعرفي حقوقك، واكتبي شروطك، وأصرّي على التوثيق، واختاري اليسر على المظاهر.'},

 {name:'مستعدان للأبوة والأمومة', prob:'وحدة إضافية اختيارية: تربية الأطفال معاً', optional:true,
  mirrorH:[['أتوقع أن أشارك في الرضاعات الليلية وتوصيل المدرسة والواجبات.',5],['أرى أن تربية الأطفال مسؤولية الأم أساساً.',1],['أستطيع البقاء هادئاً وصبوراً مع طفل يبكي.',5]],
  mirrorW:[['أتوقع أن يشارك زوجي في الليالي والمدرسة والواجبات، وسأتركه يفعل ذلك بطريقته.',5],['أنوي أن أقرر كل شيء يخص الأطفال وحدي.',1],['أستطيع البقاء هادئة وصبورة مع طفل يبكي.',5]],
  learn:[
   {q:'تُظهر أبحاث أساليب التربية أن الأطفال ينجحون أكثر مع والدين:',o:['صارمين وباردين: قواعد بلا دفء','دافئين وحازمين: قواعد واضحة مع محبة وشرح','متساهلين: محبة بلا قواعد'],a:1,e:'تربط عقود من الأبحاث منذ ديانا بومريند هذا الأسلوب «الحازم الدافئ» بنتائج أفضل للأطفال. وقد علّم لقمان ابنه بحنان («يا بُنيّ») وتوجيه واضح (لقمان: 13-19).'},
   {q:'معنى «كلكم راعٍ وكلكم مسؤول عن رعيته»:',o:['الأب وحده مسؤول','الوالدان كلاهما مسؤولان عن تربية الأطفال','المدرسة هي المسؤولة'],a:1,e:'(متفق عليه). يذكر الحديث الرجل في أهله والمرأة في بيت زوجها: التربية مسؤولية مشتركة.'},
   {q:'قبل الزواج، أهم ما يُتفق عليه بشأن الأطفال:',o:['أسماؤهم','التوقيت، والعدد، والأدوار، وأسلوب التأديب، وقواعد الدين والشاشات','أي زي مدرسي أجمل'],a:1,e:'التوقعات غير المعلنة عن الأطفال تسبب خلافات كثيرة، خاصة حين يعمل الزوجان. الاتفاق المبكر يمنع الخلاف لاحقاً.'}],
  playH:[
   {who:'الثالثة فجراً',s:'الرضيع يبكي مرة أخرى، وزوجتك منهكة، ولديك عمل في الصباح.',o:[['تتظاهر بالنوم.',0],['توقظ زوجتك.',3],['تأخذ الرضيع لتنام هي، وتتفقان غداً على جدول ليلي عادل.',15]],e:'السنة الأولى مع الطفل من أصعب اختبارات الزواج، وتقاسم الليالي يحميكما معاً.'},
   {who:'التأديب',s:'ابنك ذو السنوات الست يضرب أخته.',o:[['تصرخ عليه وتضربه.',0],['تتجاهل الأمر، فالأولاد هكذا.',3],['توقفه بهدوء، وتشرح القاعدة، وتعطيه عاقبة عادلة، ثم تعيد الود بضمّة.',15]],e:'الحزم مع الدفء هو الأنجح. وما ضرب النبي ﷺ بيده خادماً ولا امرأة قط (رواه مسلم)، وكان رفيقاً بالأطفال.'}],

    W:{mirror:[['أنظّف الشعر من المصرف والمغسلة بعد استخدامهما.',5],['أترك مستحضرات التجميل أو المناديل في مكانها بعد الاستخدام.',1],['أنظّف أسناني قبل النوم كل ليلة.',5]],

            {who:'وقت النوم',s:'في غرفة النوم ملابس على الكرسي، ومناديل بجانب السرير، ورائحة خانقة.',o:[['تنامين، لا بأس.',0],['ترشّين عطراً فوق الفوضى.',5],['ترتيب في 5 دقائق: الملابس في مكانها، والمناديل في السلة، وهواء نقي، ورائحة طيبة، وتنظيف الأسنان.',15]],e:'غرفة النوم المرتبة المنعشة تقرّب، والفوضى تُبعد.'}],
      mission:'اختاري تحدياً لمدة 7 أيام:',
      missionOpts:['اتركي الحمام نظيفاً تماماً بعد كل استخدام.','نظّفي أسنانك (أو استعملي السواك) كل ليلة قبل النوم.','رتّبي غرفة النوم 5 دقائق كل مساء: ترتيب، وسلة، وهواء نقي، ورائحة طيبة.','لا تتركي أثراً خلفك: لا مناديل ولا أكواب ولا ملابس متروكة في أي مكان.','ابتسمي لعائلتك كل صباح: «تبسّمك في وجه أخيك صدقة».']}},

const SCI_EN = [["Small things, often", "Gottman's research found that lasting marriages are built on small daily moments more than on big gestures. A clean bathroom and fresh breath are daily signals of respect, and Islam teaches the same: purity is half of faith.", "John Gottman, The Seven Principles for Making Marriage Work"], ["Appreciation protects", "In Gottman's studies, contempt (mockery, eye-rolling, insults) was the strongest single predictor of divorce. Its antidote is a culture of appreciation. The Prophet ﷺ said: \"Whoever does not thank people does not thank Allah.\"", "John Gottman, The Seven Principles for Making Marriage Work"], ["The first three minutes", "Gottman found that the first three minutes of a hard conversation predict how it ends. A harsh start-up usually ends badly; a gentle one (\"I feel… I need…\") usually ends well. The Quran asks for gentle speech (qawlan layyina) even with Pharaoh (20:44).", "John Gottman, The Seven Principles for Making Marriage Work"], ["Know your raw spots", "Sue Johnson calls our sensitive points \"raw spots\": old hurts that make us overreact. Knowing and sharing yours before marriage lets your spouse handle them with care instead of stepping on them by accident.", "Sue Johnson, Hold Me Tight"], ["Higher expectations than ever", "Finkel shows that marriage moved from an institution (security, family) to a self-expressive bond (growth, being understood), so we now expect one person to be friend, lover and counsellor. That raises the bar for choosing. The Prophet ﷺ pointed to what matters most: deen and character (at-Tirmidhi).", "Eli Finkel, The All-or-Nothing Marriage"], ["Turning toward", "In a Gottman study, couples still married years later had turned toward each other's bids for attention 86% of the time; couples who divorced, only 33%. A phone that wins over your spouse's bid is a turn away. The Prophet ﷺ would turn his whole body toward the person speaking to him.", "John Gottman, The Seven Principles for Making Marriage Work"], ["Perpetual problems", "Gottman found that about 69% of couple conflicts are \"perpetual\": rooted in different values and never fully solved. Money styles are a classic example. Happy couples manage them calmly with clear systems, like the Quran's instruction to write down debts (2:282).", "John Gottman, The Seven Principles for Making Marriage Work"], ["Accepting influence", "Gottman found that husbands who refused to accept their wife's influence had an 81% chance of their marriage breaking down. Accepting influence means taking the other's view seriously. The Prophet ﷺ took Umm Salama's advice at Hudaybiyyah (al-Bukhari).", "John Gottman, The Seven Principles for Making Marriage Work"], ["Don't ask one person for everything", "Finkel suggests not asking one spouse to meet every need; friends and family can carry part of the load. In our culture the extended family is a gift, as long as the couple stays a united front and private matters stay private.", "Eli Finkel, The All-or-Nothing Marriage"], ["The invisible work", "A Harvard study (Allison Daminger, 2019) found that anticipating, planning and monitoring home needs falls mostly on women, even when chores look shared. Seeing this work is the first step. The Prophet ﷺ was in the service of his family at home (al-Bukhari).", "Allison Daminger, American Sociological Review, 2019"], ["Flooding", "When the heart rate goes above about 100 beats a minute, Gottman calls it \"flooding\": clear thinking shuts down. A break of at least 20 minutes, doing something calming, lets the body reset. The Sunnah of sitting down, wudu and changing place fits this exactly.", "John Gottman, The Seven Principles for Making Marriage Work"], ["The 5 to 1 ratio", "Gottman found that stable couples have about five positive moments for every negative one, even during conflict. Kind words, a smile and a compliment are deposits that carry the marriage through hard days. \"A good word is charity\" (al-Bukhari, Muslim).", "John Gottman, The Seven Principles for Making Marriage Work"], ["Are you there for me?", "Sue Johnson's research shows that every partner silently asks: \"Are you there for me?\" The answer is A.R.E.: Accessible, Responsive, Engaged. A calm, welcoming home answers \"yes\" every day. The Quran describes spouses as a source of sakina, tranquillity (30:21).", "Sue Johnson, Hold Me Tight"], ["Do new things together", "Research by Arthur Aron found that couples who share new, challenging activities report more satisfaction in their relationship. Learning a dish or building furniture together counts. The Prophet ﷺ raced with Aisha (Abu Dawud).", "Arthur Aron and colleagues, 2000"], ["A wise outside view", "In a 2013 study by Finkel, couples who spent 7 minutes, three times a year, writing about their conflicts from the view of a neutral, kind third party kept their marriage quality from declining over the year, while other couples declined. The Quran calls for a wise arbiter from each family (4:35).", "Eli Finkel, The All-or-Nothing Marriage"]];
const SCI_AR = [["الأشياء الصغيرة كل يوم", "وجدت أبحاث غوتمان أن الزواج الناجح يُبنى على اللحظات اليومية الصغيرة أكثر من المبادرات الكبيرة. الحمام النظيف والفم المنعش رسائل احترام يومية، والإسلام يعلّم الشيء نفسه: الطُّهور شطر الإيمان.", "جون غوتمان، «المبادئ السبعة لإنجاح الزواج»"], ["التقدير يحمي", "في دراسات غوتمان كان الاحتقار (السخرية، وتدوير العينين، والإهانة) أقوى مؤشر منفرد على الطلاق، وعلاجه ثقافة من التقدير. قال النبي ﷺ: «من لا يشكر الناس لا يشكر الله».", "جون غوتمان، «المبادئ السبعة لإنجاح الزواج»"], ["الدقائق الثلاث الأولى", "وجد غوتمان أن الدقائق الثلاث الأولى من الحديث الصعب تتنبأ بنهايته. البداية القاسية تنتهي غالباً بشكل سيئ، واللطيفة («أشعر… أحتاج…») تنتهي غالباً بشكل جيد. والقرآن يأمر بالقول اللين حتى مع فرعون (طه: 44).", "جون غوتمان، «المبادئ السبعة لإنجاح الزواج»"], ["اعرف نقاطك الحساسة", "تسمّي سو جونسون مواضع الحساسية لدينا «النقاط الحساسة»: جروح قديمة تجعلنا نبالغ في ردة الفعل. معرفتها ومشاركتها قبل الزواج تساعد الشريك على التعامل معها بعناية بدلاً من إيلامها دون قصد.", "سو جونسون، «احضنّي بقوة»"], ["توقعات أعلى من أي وقت", "يبيّن فينكل أن الزواج انتقل من مؤسسة (أمان وعائلة) إلى رابطة تعبير عن الذات (نمو وتفهّم)، فصرنا ننتظر من شخص واحد أن يكون صديقاً وحبيباً ومستشاراً. وهذا يرفع أهمية حسن الاختيار، وقد أرشد النبي ﷺ إلى الأهم: الدين والخلق (رواه الترمذي).", "إيلي فينكل، «الزواج: كل شيء أو لا شيء»"], ["الالتفات إلى الشريك", "في إحدى دراسات غوتمان، استجاب الأزواج الذين استمر زواجهم لطلبات الاهتمام في 86% من المرات، والذين انفصلوا في 33% فقط. الهاتف الذي يفوز على طلب الشريك ابتعاد عنه. وكان النبي ﷺ إذا التفت التفت بكامله إلى محدّثه.", "جون غوتمان، «المبادئ السبعة لإنجاح الزواج»"], ["المشكلات الدائمة", "وجد غوتمان أن نحو 69% من خلافات الأزواج «دائمة»: نابعة من قيم مختلفة ولا تُحل تماماً، وأسلوب التعامل مع المال مثال واضح. الأزواج السعداء يديرونها بهدوء وبأنظمة واضحة، مثل أمر القرآن بكتابة الدَّين (البقرة: 282).", "جون غوتمان، «المبادئ السبعة لإنجاح الزواج»"], ["تقبّل التأثير", "وجد غوتمان أن الأزواج الذين يرفضون تقبّل تأثير زوجاتهم كانت فرصة انهيار زواجهم 81%. تقبّل التأثير يعني أخذ رأي الآخر بجدية. وقد أخذ النبي ﷺ بمشورة أم سلمة في الحديبية (رواه البخاري).", "جون غوتمان، «المبادئ السبعة لإنجاح الزواج»"], ["لا تطلب كل شيء من شخص واحد", "يقترح فينكل ألا يُطلب من شريك واحد تلبية كل الحاجات، فالأصدقاء والأهل يحملون جزءاً منها. والعائلة الممتدة في ثقافتنا نعمة، ما دام الزوجان صفاً واحداً والأمور الخاصة تبقى خاصة.", "إيلي فينكل، «الزواج: كل شيء أو لا شيء»"], ["العمل غير المرئي", "وجدت دراسة من جامعة هارفارد (أليسون دامينغر، 2019) أن توقّع احتياجات البيت والتخطيط لها ومتابعتها يقع غالباً على النساء، حتى عندما تبدو المهام مقسّمة. رؤية هذا العمل أول خطوة. وكان النبي ﷺ في مهنة أهله (رواه البخاري).", "أليسون دامينغر، المجلة الأمريكية لعلم الاجتماع، 2019"], ["الغمر العاطفي", "عندما يتجاوز نبض القلب نحو 100 نبضة في الدقيقة يسمّيه غوتمان «الغمر»: يتوقف التفكير الواضح. استراحة لا تقل عن 20 دقيقة في نشاط مهدّئ تعيد الجسم إلى توازنه. وسنّة الجلوس والوضوء وتغيير المكان تتفق مع ذلك تماماً.", "جون غوتمان، «المبادئ السبعة لإنجاح الزواج»"], ["نسبة 5 إلى 1", "وجد غوتمان أن الأزواج المستقرين لديهم نحو خمس لحظات إيجابية مقابل كل لحظة سلبية، حتى أثناء الخلاف. الكلمة الطيبة والابتسامة والمديح ودائع تحمل الزواج في الأيام الصعبة. «الكلمة الطيبة صدقة» (متفق عليه).", "جون غوتمان، «المبادئ السبعة لإنجاح الزواج»"], ["هل أنت موجود لأجلي؟", "تُظهر أبحاث سو جونسون أن كل شريك يسأل بصمت: «هل أنت موجود لأجلي؟». والجواب ثلاثة: قريب، ومستجيب، ومنخرط. البيت الهادئ المرحِّب يجيب «نعم» كل يوم. والقرآن يصف الأزواج بأنهم سكن لبعضهم (الروم: 21).", "سو جونسون، «احضنّي بقوة»"], ["جرّبا أشياء جديدة معاً", "وجدت أبحاث آرثر آرون أن الأزواج الذين يشتركون في أنشطة جديدة وفيها تحدٍّ يشعرون برضا أكبر عن علاقتهم. تعلّم طبق أو تركيب أثاث معاً يدخل في ذلك. وقد سابق النبي ﷺ عائشة (رواه أبو داود).", "آرثر آرون وزملاؤه، 2000"], ["نظرة حكيمة من الخارج", "في دراسة لفينكل عام 2013، حافظ الأزواج الذين كتبوا 7 دقائق، ثلاث مرات في السنة، عن خلافاتهم من منظور طرف ثالث محايد ولطيف على جودة زواجهم خلال السنة، بينما تراجعت لدى غيرهم. والقرآن يدعو إلى حَكَم من أهله وحَكَم من أهلها (النساء: 35).", "إيلي فينكل، «الزواج: كل شيء أو لا شيء»"]];

function isOpen(i){return isOpt(i) || i===0 || i<=(S.unlocked||0) || !!S.worlds[i-1];}
const ANS_KEYS=['stage','mirror','li','lans','lfirst','pi','pans','pfirst','orders','mpick','mscore','refl'];
function pickAns(c){const o={};ANS_KEYS.forEach(k=>{if(c[k]!==undefined)o[k]=JSON.parse(JSON.stringify(c[k]))});return o;}
function saveDraft(){ if(!cur||cur.type!=='world'||cur.stage>=4) return; S.drafts=S.drafts||{}; S.drafts[cur.w]=pickAns(cur); save(); }
function computeScores(){
  const m=mirrorScore(), ww=tv(WL()[cur.w],cur.w);
  const F=(f,a,k)=>f&&f[k]!=null?f[k]:a[k];
  cur.lscore=Math.round((cur.lans||[]).reduce((a,x,k)=>{x=F(cur.lfirst,cur.lans,k);return a+(ww.learn[k]&&x===ww.learn[k].a?1:0)},0)*30/ww.learn.length);
  cur.pscore=Math.round((cur.pans||[]).reduce((a,x,k)=>{x=F(cur.pfirst,cur.pans,k);return a+(x==null||!ww.play[k]?0:ww.play[k].o[x][1])},0)*30/(15*ww.play.length));
  cur.total=m.pts+cur.lscore+cur.pscore+(cur.mscore||0); cur.perfect=m.perfect;
}
function startWorld(i,fresh){
  const base={type:'world',w:i,stage:0,mirror:[null,null,null],li:0,lans:[null,null,null],lscore:0,pi:0,pans:[null,null],orders:[null,null],pscore:0,mscore:null};
  const d=S.drafts&&S.drafts[i], rec=S.worlds[i];
  if(fresh){ if(S.drafts) delete S.drafts[i]; cur=base; save(); }
  else if(d) cur={...base,...JSON.parse(JSON.stringify(d)),type:'world',w:i};
  else if(rec&&rec.ans){ cur={...base,...JSON.parse(JSON.stringify(rec.ans)),type:'world',w:i,stage:4}; computeScores(); cur.isBest=cur.total>=rec.best; }
  else cur=base;
  render();scrollTo(0,0)}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function mirrorScore(){
  const w=tv(WL()[cur.w],cur.w);
  const perfect=w.mirror.every((m,k)=>cur.mirror[k]===m[1]);
  return {pts:perfect?12:20,perfect};
}
function finishWorld(){
  computeScores();
  const prev=S.worlds[cur.w];
  cur.isBest=!prev||cur.total>prev.best;
  S.worlds[cur.w]={best:Math.max(prev?prev.best:0,cur.total),last:cur.total,refl:cur.refl||(prev&&prev.refl)||'',ans:pickAns({...cur,stage:3})};
  if(S.drafts) delete S.drafts[cur.w];
  if(cur.w>=S.unlocked&&cur.w<N-1)S.unlocked=cur.w+1;
  save(); cur.stage=4; render(); scrollTo(0,0);
}

function tabs(active){const t=L();return `<nav class="tabs">${[['mine',t.tabMine],['match',t.tabMatch],['safety',t.tabSafety]].map(([k,l])=>`<button class="tab" data-tab="${k}" aria-pressed="${k===active}">${l}</button>`).join('')}</nav>`;}
function bindTabs(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{const k=b.dataset.tab;cur=k==='mine'?null:{type:k};render();scrollTo(0,0)})}

async function saveFile(name,blob){
  let d=null; try{ if(window.claude&&window.claude.use) d=await window.claude.use('downloads'); }catch(e){}
  if(d) return d.save({filename:name,data:blob});
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);
}

function encodeMatch(){
  const o={v:1,n:S.name,t:S.track,a:MQ.map(q=>S.match.a[q.id]??'').join(',')};
  return 'RTM1-'+btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeMatch(code){
  try{ let c=String(code||'').trim().replace(/\s+/g,''); const i=c.indexOf('RTM1-'); if(i<0) return null; c=c.slice(i+5).replace(/[^A-Za-z0-9_-]/g,'');
    c=c.replace(/-/g,'+').replace(/_/g,'/'); while(c.length%4) c+='=';
    const o=JSON.parse(decodeURIComponent(escape(atob(c)))); if(!o||o.v!==1||typeof o.a!=='string') return null;
    const arr=o.a.split(','), a={}; MQ.forEach((q,k)=>{const x=parseInt(arr[k],10); if(!isNaN(x)&&x>=0&&x<q.o[0].length) a[q.id]=x;});
    return {n:String(o.n||'').slice(0,30)||'?',t:o.t==='wife'?'wife':o.t==='husband'?'husband':'',a};
  }catch(e){ return null; }
}
const qval=(q,i)=>i*4/(q.o[0].length-1);
function colorOf(q,a,b){ if(a==null||b==null) return 'grey'; const g=Math.abs(qval(q,a)-qval(q,b)); if(q.key&&g>=1.5) return 'red'; return g<1.5?'green':g<3?'yellow':'red'; }

function matchView(){
  const t=L(), li=LI();
  S.match=S.match||{a:{},p:null,d:{}};

  if(!cur.step){ cur.step=M.p&&answered===MQ.length?'report':answered===MQ.length?'code':answered?'q':'intro';
    if(cur.step==='q') cur.ti=Math.max(0,MATCH.findIndex(tp=>tp.qs.some(q=>M.a[q.id]==null))); }
  let body='';
  if(cur.step==='intro'){

  } else if(cur.step==='q'){
    const ti=cur.ti||0, tp=MATCH[ti], done=tp.qs.every(q=>M.a[q.id]!=null);
    body=`<div class="card"><div class="row" style="justify-content:space-between"><h3>${tp.t[li]}</h3><span class="counter">${t.matchTopicOf(ti+1,MATCH.length)}</span></div>

  } else if(cur.step==='code'||cur.step==='report'){
    const code=encodeMatch();
    const codeCard=`<div class="card"><h3>${t.codeH}</h3><p class="note" style="margin:0">${t.codeNote}</p>
      <textarea class="code" id="mycode" rows="3" readonly>${code}</textarea>
      <div class="row"><button class="btn ghost" id="copyCode">${t.copyCode}</button><a class="btn ghost" style="text-decoration:none" href="https://wa.me/?text=${encodeURIComponent(t.waMsg+' '+code)}" target="_blank" rel="noopener">${t.waShare}</a><span class="note" id="copyMsg" aria-live="polite"></span></div>
      <h3>${t.partnerH}</h3><textarea class="code" id="pcode" rows="3" placeholder="${t.partnerPh}">${M.p?esc(M.pc||''):''}</textarea>
      <div class="row"><button class="btn" id="mCompare">${t.compare}</button><button class="btn quiet" id="mEdit">${t.editAns}</button>${M.p?`<button class="btn quiet" id="mRemove">${t.removePartner}</button>`:''}</div>

    if(cur.step==='code'||!M.p){ body=codeCard; }
    else{
      const P=M.p, rows=MQ.map(q=>({q,c:colorOf(q,M.a[q.id],P.a[q.id])}));
      const cnt=c=>rows.filter(r=>r.c===c).length, known=rows.filter(r=>r.c!=='grey');
      const align=known.length?Math.round(known.reduce((a,r)=>a+(1-Math.abs(qval(r.q,M.a[r.q.id])-qval(r.q,P.a[r.q.id]))/4),0)/known.length*100):0;
      const pending=rows.filter(r=>(r.c==='yellow'||r.c==='red')&&!M.d[r.q.id]).length;
      const lbl=(q,i)=>i==null?'—':esc(q.o[li][i]);
      const topics=MATCH.map(tp=>{const rs=rows.filter(r=>r.q.tp===tp);return `<div class="card"><h3>${tp.t[li]}</h3>
        ${rs.map(r=>`<div class="mrow c-${r.c}"><span class="dot" aria-hidden="true"></span><div><div class="q2">${esc(li?r.q.ar:r.q.en)} <span class="note">· ${r.c==='green'?t.green:r.c==='yellow'?t.yellow:r.c==='red'?t.red:''}</span></div>
          <div class="note">${t.you}: ${lbl(r.q,M.a[r.q.id])} · ${esc(P.n)}: ${lbl(r.q,P.a[r.q.id])}</div>
          ${r.c==='yellow'||r.c==='red'?`<label class="disc"><input type="checkbox" id="d-${r.q.id}" data-d="${r.q.id}" ${M.d[r.q.id]?'checked':''}> ${t.discussed}</label>`:''}</div></div>`).join('')}
        ${rs.some(r=>r.c==='yellow'||r.c==='red')?`<div class="tipbox"><b>${t.tipLbl}:</b> ${esc(tp.tip[li])}</div>`:''}</div>`}).join('');
      const tScore=tp=>rows.filter(r=>r.q.tp===tp&&r.c==='green').length;
      const topA=[...MATCH].sort((a,b)=>tScore(b)-tScore(a)).slice(0,3).map(tp=>tp.t[li]);
      const disc=MATCH.filter(tp=>rows.some(r=>r.q.tp===tp&&(r.c==='yellow'||r.c==='red'))).map(tp=>tp.t[li]).slice(0,3);
      const unlocked=pending===0&&cnt('grey')===0;
      cur._cert={topA,disc:disc.length?disc:['—'],align,partner:P.n};

          :`<p class="note" style="margin:0">${t.coupleCertLocked} (${pending})</p>`}</section>
        ${codeCard}`;
    }
  }
  $('#app').innerHTML=`<div class="stack">${tabs('match')}${body}</div>`;

  const go=st=>{cur.step=st;render();scrollTo(0,0)};
  if($('#mStart')) $('#mStart').onclick=()=>{cur.ti=0;go('q')};
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{M.a[b.dataset.q]=+b.dataset.k;save();render()});
  if($('#mNext')) $('#mNext').onclick=()=>{ if(cur.ti<MATCH.length-1){cur.ti++;go('q')} else go(M.p?'report':'code'); };
  if(cur.step==='q') $('#prev').onclick=()=>{ if(cur.ti>0){cur.ti--;go('q')} else go('intro'); };
  if($('#copyCode')) $('#copyCode').onclick=()=>{const v=$('#mycode').value;const ok=()=>$('#copyMsg').textContent='✓';try{navigator.clipboard.writeText(v).then(ok,()=>{$('#mycode').select()})}catch(e){$('#mycode').select()}};
  if($('#mEdit')) $('#mEdit').onclick=()=>{cur.ti=0;go('q')};
  if($('#mRemove')) $('#mRemove').onclick=()=>{M.p=null;M.pc='';M.d={};save();go('code')};
  if($('#mCompare')) $('#mCompare').onclick=()=>{
    const raw=$('#pcode').value, P=decodeMatch(raw), err=$('#mErr');
    if(!P){err.textContent=t.errCode;return;}
    if(raw.trim().replace(/\s+/g,'')===encodeMatch()||(P.n===S.name&&P.t===S.track)){err.textContent=t.errSame;return;}
    if(P.t&&P.t===S.track){err.textContent=t.errTrack;return;}
    M.p=P; M.pc=raw.trim(); M.d={}; save(); go('report');
  };
  document.querySelectorAll('[data-d]').forEach(c=>c.onchange=()=>{M.d[c.dataset.d]=c.checked;save();render()});
  if($('#mDl')) $('#mDl').onclick=async()=>{
    const b=$('#mDl'), c=cur._cert, msg=$('#mDlMsg'); b.disabled=true;
    try{
      const date=new Date().toLocaleDateString(t.locale,{day:'numeric',month:'long',year:'numeric'});
      const blob=await certPNG({title:t.coupleTitle,name:`${S.name} & ${c.partner}`,tier:'',idx:'',date,top:c.topA,low:c.disc,line:t.coupleLine,pill:`${t.alignLbl} ${c.align}%`,h1:t.mostAligned,h2:t.discussedH});
      await saveFile('ready-couple-certificate.png',blob); msg.textContent='✓';
    }catch(e){ msg.textContent=e&&e.code==='declined'?t.cancelled:t.unavail; }
    b.disabled=false;
  };
}

function safetyView(){
  const t=L(), li=LI();
  cur.ans=cur.ans||SAFE.map(()=>null);
  const yes=cur.ans.filter(x=>x===true).length, anyAns=cur.ans.some(x=>x!==null);
  const urgent=cur.ans[3]===true||cur.ans[5]===true||cur.ans[7]===true;
  const result=!anyAns?'':yes===0?`<div class="okbox">${t.safeNone}</div>`
    :`<div class="alert stack" style="gap:8px"><span>${t.safeWarn}</span>${cur.ans[5]===true?`<span>${t.safeForced}</span>`:''}${urgent?`<b>${t.safeUrgent}</b>`:''}</div>`;
  $('#app').innerHTML=`<div class="stack">
    <button class="btn exit" id="qexit">✕ ${t.quickExit}</button>
    ${S.track?tabs('safety'):`<button class="btn quiet" id="sBack" style="align-self:flex-start">${t.back}</button>`}
    <section class="panel stack" style="gap:10px"><h2>${t.safeH}</h2><p class="lead">${t.safeIntro}</p></section>
    <div class="card"><h3>${t.safeCheckH}</h3><p class="note" style="margin:0">${t.safeNote}</p>
      <div>${SAFE.map((it,k)=>`<div class="safe-item"><span>${esc(li&&S.track==='husband'?SAFE_F[k]:it[li])}</span><span class="yn"><button data-s="${k}" data-v="1" aria-pressed="${cur.ans[k]===true}">${t.yes}</button><button data-s="${k}" data-v="0" aria-pressed="${cur.ans[k]===false}">${t.no}</button></span></div>`).join('')}</div>
      ${result}</div>
    <div class="card"><h3>${t.resH}</h3><div class="res">${RES.map(r=>`<b>${r[0]}</b><span>${esc(li?r[2]:r[1])}</span>`).join('')}</div><p class="note" style="margin:0">${t.resNote}</p></div>
    ${S.track?`<div class="card"><h3>${t.backupH}</h3><p class="note" style="margin:0">${t.backupNote}</p>
      <textarea class="code" id="bk" rows="3" readonly>${backupCode()}</textarea>
      <div class="row"><button class="btn ghost" id="bkCopy">${t.copyCode}</button><span class="note" id="bkMsg" aria-live="polite"></span></div>
      <textarea class="code" id="rs" rows="2" placeholder="${t.restorePh}"></textarea>
      <div class="row"><button class="btn" id="rsBtn">${t.restore}</button><span class="note" id="rsMsg" aria-live="polite"></span></div></div>`:''}
    <div class="card" id="contact"><h3>${t.contactH}</h3><p class="note" style="margin:0">${t.contactNote}</p>
      <div class="row"><b class="mail" dir="ltr">contact@readyto-marry.com</b><button class="btn ghost" id="mailCopy">${t.copyCode.replace(/code|الرمز/,'').trim()||'Copy'}</button><span class="note" id="mailMsg" aria-live="polite"></span></div>
      <div class="field"><label for="cMsg">${t.contactMsg}</label><textarea id="cMsg" rows="4" placeholder="${t.contactPh}"></textarea></div>
      <div class="row"><a class="btn" id="cSend" href="mailto:contact@readyto-marry.com" style="text-decoration:none">${t.contactSend}</a></div></div>
    <div class="card"><h3>${t.verifyH}</h3><p class="note" style="margin:0">${t.verifyNote}</p>
      <div class="field"><label for="vName">${t.verifyName}</label><input id="vName" autocomplete="off"></div>
      <div class="field"><label for="vId">${t.certIdLbl}</label><input id="vId" dir="ltr" autocomplete="off" placeholder="RTM-…"></div>
      <div class="row"><button class="btn ghost" id="vBtn">${t.verifyBtn}</button></div><p id="vMsg" aria-live="polite" style="margin:0"></p></div>
    <div class="card"><h3>${t.discH}</h3><p style="margin:0">${t.disc}</p></div>
  </div>`;
  $('#qexit').onclick=quickExit;
  $('#mailCopy').onclick=()=>{try{navigator.clipboard.writeText('contact@readyto-marry.com').then(()=>$('#mailMsg').textContent='✓',()=>{})}catch(e){}};
  const upMail=()=>{$('#cSend').href='mailto:contact@readyto-marry.com?subject='+encodeURIComponent(t.contactSubj)+'&body='+encodeURIComponent($('#cMsg').value)};
  $('#cMsg').oninput=upMail; upMail();
  if($('#bkCopy')) $('#bkCopy').onclick=()=>{try{navigator.clipboard.writeText($('#bk').value).then(()=>$('#bkMsg').textContent='✓',()=>$('#bk').select())}catch(e){$('#bk').select()}};
  if($('#rsBtn')) $('#rsBtn').onclick=()=>{const X=restoreCode($('#rs').value); if(!X){$('#rsMsg').textContent=t.restoreBad;return;} S={...X,lang:S.lang}; save(); $('#rsMsg').textContent=t.restoreOk; setTimeout(()=>{cur=null;render();scrollTo(0,0)},700);};
  $('#vBtn').onclick=()=>{const r=verifyCert($('#vName').value,$('#vId').value), m=$('#vMsg');
    if(!r){m.textContent=t.verifyBad;m.style.color='var(--bad)';return;}
    m.style.color='var(--good)'; m.textContent=t.verifyOk(r.name,t.role[r.track],r.idx,dayDate(r.day).toLocaleDateString(t.locale,{day:'numeric',month:'long',year:'numeric'}));};
  if(S.track) bindTabs(); else $('#sBack').onclick=()=>{cur=null;render()};
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{cur.ans[+b.dataset.s]=b.dataset.v==='1';render()});
}

/* ---------- trust helpers: quick exit, certificate ID, backup ---------- */
function quickExit(){ cur=null; try{ window.top.location.replace('https://www.google.com'); }catch(e){} try{ location.replace('https://www.google.com'); }catch(e){} }
if(document.addEventListener) document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&cur&&cur.type==='safety') quickExit(); });
const b64e=str=>btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=c=>{c=c.replace(/[^A-Za-z0-9_-]/g,'').replace(/-/g,'+').replace(/_/g,'/');while(c.length%4)c+='=';return decodeURIComponent(escape(atob(c)));};
function h32(str){let h=2166136261;for(const ch of str){h^=ch.codePointAt(0);h=Math.imul(h,16777619);}h^=h>>>13;h=Math.imul(h,1274126177);return (h^(h>>>16))>>>0;}
const normName=n=>String(n||'').trim().toLowerCase().replace(/\s+/g,' ');
function certId(name,track,idx,day){const body=(track==='wife'?'W':'H')+idx+'-'+day.toString(36).toUpperCase();
  const sig=h32('rtm|'+normName(name)+'|'+body).toString(36).toUpperCase().padStart(7,'0').slice(-6);return 'RTM-'+body+'-'+sig;}
const dayDate=d=>new Date(Date.UTC(2026,0,1)+d*864e5);
function verifyCert(name,id){const m=String(id||'').trim().toUpperCase().match(/^RTM-([HW])(\d{1,3})-([0-9A-Z]+)-([0-9A-Z]{6})$/); if(!m||!normName(name)) return null;
  const idx=+m[2], day=parseInt(m[3],36), track=m[1]==='W'?'wife':'husband';
  return certId(name,track,idx,day)===String(id).trim().toUpperCase()?{name:String(name).trim(),track,idx,day}:null;}
function backupCode(){return 'RTMP1-'+b64e(JSON.stringify({...S,lang:undefined}));}
function restoreCode(code){try{let c=String(code||'').trim().replace(/\s+/g,'');const i=c.indexOf('RTMP1-');if(i<0)return null;
  const X=JSON.parse(b64d(c.slice(i+6))); if(!X||typeof X!=='object'||!X.track||typeof X.worlds!=='object') return null; return migr4(X);}catch(e){return null;}}

render();
</script>
