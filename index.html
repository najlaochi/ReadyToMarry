  const objs=[];
  // mosque — never burns: a refuge whose light stays on (door of tawbah is open)
  if(msq>=10)objs.push({y:66,d:()=>{const bx=140,by=48,big=msq>=60,gold=(c.mosque||0)>0;
    x.fillStyle="#efe6d2";x.fillRect(bx,by+6,24,14);x.fillStyle=gold?"#f2c14e":"#3fb7a0";x.fillRect(bx+6,by,12,6);x.fillRect(bx+8,by-2,8,2);x.fillStyle="#f2c14e";x.fillRect(bx+11,by-5,2,3);
    x.fillStyle="#7a5a3a";x.fillRect(bx+10,by+13,4,7);x.fillStyle=(night||st>=3)?"#ffd75e":"#5a6b7a";x.fillRect(bx+3,by+10,2,3);x.fillRect(bx+19,by+10,2,3);
    if(st>=3){x.fillStyle="rgba(255,215,94,.25)";x.fillRect(bx+8,by+11,8,9)}
    if(big){x.fillStyle="#efe6d2";x.fillRect(bx+27,by-8,4,28);x.fillStyle=gold?"#f2c14e":"#3fb7a0";x.fillRect(bx+26,by-11,6,3);x.fillStyle="#f2c14e";x.fillRect(bx+28,by-14,2,3)}}});
  if(well>0&&st<3)objs.push({y:100,d:()=>{const bx=88,by=92;x.fillStyle="#b9b3a6";x.fillRect(bx,by,16,6);x.fillStyle=st===2?"#7a6a52":"#3d8fe0";x.fillRect(bx+2,by+1,12,2);x.fillStyle="#b9b3a6";x.fillRect(bx+7,by-6,2,6);
    if(st<2){x.fillStyle="#9fd6ff";for(let i=0;i<4;i++){const f=(t*2+i/4)%1;x.fillRect(bx+7+Math.round(Math.sin(i*2)*f*5),by-6-Math.round(Math.sin(f*Math.PI)*5),1,1)}}}});
  const fireOn=(px,py,i)=>{if(st<4)return;for(let k=0;k<5;k++){const f=Math.sin(t*10+i*3+k*1.3);x.fillStyle=f>.3?"#ffd23a":f>-.3?"#ff7a1a":"#e8301a";x.fillRect(px+2+k,py-1-Math.round((f+1)*2),1,2+Math.round((f+1)))}};
  const bare=st>=2?SPR.palm.map((r,j)=>j<4?r.replace(/g/g,".").replace(/G/g,j%2?".":"G"):r):SPR.palm;
  for(let i=0;i<nPalm+(sproutP?1:0);i++){const r=mulberry(100+i),px=6+Math.floor(r()*125),py=50+Math.floor(r()*12),sp=i>=nPalm;
    objs.push({y:py+13,d:()=>{if(sp){sprS(px+4,py+10,SPR.sprout)}else{sprS(px,py,bare);fireOn(px,py,i)}}})}
  const bareF=st>=2?SPR.fruit.map((r,j)=>j<7?r.replace(/[gR]/g,".").replace(/G/g,(m,o)=>(o+j)%3?".":"G"):r):SPR.fruit;
  for(let i=0;i<nFruit;i++){const r=mulberry(300+i),px=4+Math.floor(r()*178),py=80+Math.floor(r()*16);objs.push({y:py+10,d:()=>{sprS(px,py,bareF);fireOn(px,py,i+20)}})}
  const fc=["#ff7eb6","#ffffff","#b78cff","#ffd75e","#ff8a5c"];
  for(let i=0;i<nFl;i++){const r=mulberry(500+i),px=Math.floor(r()*188),py=84+Math.floor(r()*20),col=st?"#9c8a6a":fc[i%5];objs.push({y:py+3,d:()=>sprS(px,py,[".P.","PYP",".P.",".g."],col)})}
  // white lilies of tawbah always bloom, even in the fire
  for(let i=0;i<nLily;i++){const r=mulberry(700+i),px=10+Math.floor(r()*170),py=64+Math.floor(r()*8);objs.push({y:py+4,d:()=>spr(x,px,py,SPR.lily,PAL,false)})}
  for(let i=0;i<nLant;i++){const px=8+i*18,py=100;objs.push({y:py+6,d:()=>{x.fillStyle="#5a4632";x.fillRect(px+1,py-4,1,8);x.fillStyle=(night||st>=3)?"#ffd75e":"#e0a53a";x.fillRect(px,py-7,3,3);
    if(night||st>=3){x.fillStyle="rgba(255,215,94,.25)";x.fillRect(px-2,py-9,7,7)}}})}
  objs.sort((a,b)=>a.y-b.y).forEach(o=>o.d());
  for(let i=0;i<nBird;i++){const bx=((i*37+t*(8+i*2))%(W+20))-10,by=14+((i*13)%30)+Math.round(Math.sin(t*2+i)*2);
    spr(x,Math.round(bx),by,(Math.floor(t*4+i)%2)?SPR.bird1:SPR.bird2,{B:night?"#cfd8ff":"#2b2b3a"},false)}
  // embers & ash rising (3-4), ground flames (4)
  if(st>=3){const n=st===4?60:25;for(let i=0;i<n;i++){const r=mulberry(1200+i),sx=Math.floor(r()*W),sp=6+r()*14,y=H-((t*sp+r()*H)%H);
    x.fillStyle=st===4?(i%3?"#ff7a1a":"#ffd23a"):(i%2?"#aa4a1a":"#6a5a50");x.fillRect(sx+Math.round(Math.sin(t+i)*2),Math.round(y),1,1)}}
  if(st===4){for(let i=0;i<W;i+=2){const f=Math.sin(t*8+i*.7)+Math.sin(t*5+i*.3);const h=3+Math.round((f+2)*2.2);
    for(let k=0;k<h;k++){x.fillStyle=k<2?"#e8301a":k<h-2?"#ff7a1a":"#ffd23a";x.fillRect(i,H-1-k,2,1)}}}
  const OV=[null,"rgba(60,50,40,.18)","rgba(90,60,20,.22)","rgba(120,30,0,.22)","rgba(170,20,0,.18)"][st];
  if(OV){x.fillStyle=OV;x.fillRect(0,0,W,H)}
  if(st===4&&Math.sin(t*1.3)>.2){x.fillStyle="rgba(255,60,0,.06)";x.fillRect(0,0,W,H)}
}
function drawFlame(cv,n){const x=cv.getContext("2d");x.clearRect(0,0,16,20);if(!n){x.fillStyle="#555";x.fillRect(6,14,4,4);return}
  const t=performance.now()/1000,s=Math.min(1,.45+n/40),f=Math.sin(t*9)>0;
  const rows=f?["......Y.........",".....YY.........","....YOY.........","....YOOY........","...YOROY........","...YORROY.......","..YORRROY.......","..YORRRROY......","..YORRWRROY.....","..YORWWWROY.....","...YOWWWOY......","....YYYYY......."]:[".......Y........","......YY........",".....YOY........","....YOOY........","....YORY........","...YORRY........","..YORRROY.......","..YORRRROY......","..YORRWRROY.....","..YORWWWROY.....","...YOWWWOY......","....YYYYY......."];
  const P={Y:"#ffd75e",O:"#ff9f1c",R:"#ff5d2c",W:"#fff6c2"};const h=Math.round(rows.length*s),skip=rows.length-h;
  rows.slice(skip).forEach((r,j)=>{for(let i=0;i<r.length;i++){const ch=r[i];if(ch===".")continue;x.fillStyle=P[ch];x.fillRect(i+1,j+20-h,1,1)}})}
function gLoop(){cancelAnimationFrame(gAnim);const cv=document.getElementById("gcv"),fl=document.getElementById("flame");if(!cv)return;
  const L=window.__L,s=window.__s,ql=window.__ql;drawGarden(cv,L,ql);if(fl)drawFlame(fl,s.cur);gAnim=requestAnimationFrame(gLoop)}

function rGarden(){
  const l=L(),g=G(),Lf=life(),s=streaks(),lv=lvl(Lf.xp),t=dkey(new Date()),ws=weekStart(t),qs=quests(ws),e=earned(Lf,s);
  const ql=qs.filter(q=>q.ok).length;window.__L=Lf;window.__s=s;window.__ql=ql;
  if(!S.bd){S.bd=e;save()}
  const anyData=Object.keys(S.days).length>0;
  let h=`<div class="sec-title" style="margin-top:4px">🌴 ${g.gTitle}</div><p class="kintro">${g.gSub}</p>
  <div class="gwrap"><canvas id="gcv" width="192" height="108"></canvas>${!anyData?`<div class="gempty">${g.empty}</div>`:""}</div>
  ${Lf.openPts?`<div class="hellbox s${sinStage(Lf.openPts)}"><b>${g.stg[sinStage(Lf.openPts)]}</b><p>${g.hope}</p>
   <div class="small" style="margin:8px 0 6px;color:var(--gold2)">${g.openT}</div>${Lf.openList.map(([k,id,n])=>{const it=BY[id],r=(S.days[k].r||{})[id]||{};
   return`<div class="rrow"><div class="rn">${it.em} ${esc(nm(it))} ×${num(n)} <span class="small">· ${k}</span></div>
   <button class="tog ${r.t?"on":""}" data-rep="${id}" data-k="t" data-day="${k}"><span class="bx">${r.t?"✓":""}</span>${l.tawbah}</button>
   ${it.h?`<button class="tog ${r.x?"on":""}" data-rep="${id}" data-k="x" data-day="${k}"><span class="bx">${r.x?"✓":""}</span>${l.restored}</button>`:""}</div>`}).join("")}</div>`:""}
  <div class="grow3">
   <div class="panel gstat"><canvas id="flame" width="16" height="20"></canvas><div><b>${num(s.cur)}</b> <span>${g.daysL}</span><div class="small">${g.streakT} · ${g.best} ${num(s.best)}</div></div></div>
   <div class="panel gstat" style="flex-direction:column;align-items:stretch"><div style="display:flex;justify-content:space-between;align-items:baseline"><b class="rank">${g.rank[lv.rank]}</b><span class="small">${g.level} ${num(lv.n)}</span></div>
     <div class="xpbar"><i style="width:${Math.round(lv.pct*100)}%"></i></div><div class="small">${num(Lf.xp)} ${g.xp} · ${num(lv.left)} ${g.toNext}</div></div>
  </div><p class="small" style="margin:6px 2px 0">🔥 ${g.qadaN}</p>
  <div class="sec-title">⚔️ ${g.questsT}</div><p class="small" style="margin:-6px 2px 10px">${g.questN}</p><div class="quests">
  ${qs.map(q=>{const it=BY[q.id];return`<div class="quest ${q.ok?"ok":""}"><div class="qn">${q.ok?"✅":"⬜"} ${esc(nm(it))} ×${num(q.n)}</div><div class="xpbar"><i style="width:${q.c/q.n*100}%"></i></div><div class="small">${num(q.c)}/${num(q.n)}${q.ok?" · "+g.done:""}</div></div>`}).join("")}</div>
  <div class="sec-title">🏆 ${g.badgesT} <span class="small">${num(e.length)}/${num(BADGES.length)}</span></div><div class="badges">
  ${BADGES.map(b=>{const[a,n]=b[2](Lf,s),ok=a>=n;return`<div class="badge ${ok?"ok":""}"><div class="bi">${b[1]}</div><div class="bn">${b[3][S.lang]}</div><div class="bd">${b[4][S.lang]}</div>${ok?"":`<div class="xpbar sm"><i style="width:${Math.min(100,a/n*100)}%"></i></div><div class="small">${num(Math.min(a,n))}/${num(n)}</div>`}</div>`}).join("")}</div>
  <div class="sec-title">🌱 ${g.legT}</div><div class="legend2">${Object.entries(g.leg).map(([k,v])=>`<span>${{palm:"🌴",fruit:"🍎",flower:"🌸",river:"🌊",mosque:"🕌",lily:"🤍",lantern:"🏮",well:"⛲"}[k]} ${v}</span>`).join("")}</div>`;
  setTimeout(gLoop,0);
  return h;
}

/* ============ overlays ============ */
const layer=document.getElementById("layer");
function modal(html){layer.innerHTML=`<div class="ov" data-ov>${html}</div>`}
function close(){layer.innerHTML=""}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function showIntro(){const l=L();modal(`<div class="modal" style="text-align:center">${LOGO.replace('class="logo"','class="logo" style="width:64px;height:64px"')}<h3 style="margin-top:8px">${l.introT}</h3><p>${l.introB}</p>
 <div class="row" style="justify-content:center;margin-top:14px">${[["en","English"],["ar","العربية"],["fr","Français"]].map(([g,n])=>`<button class="btn ${S.lang===g?"gold":""}" data-lang="${g}">${n}</button>`).join("")}</div>
 <div class="est" style="text-align:start;margin-top:14px">${l.est}</div><p class="small" style="margin-top:10px">${l.privacy}</p><div class="row" style="justify-content:center"><button class="btn gold" data-act="begin" style="padding:12px 30px">${l.begin}</button></div></div>`)}
function showLock(){const l=L();layer.innerHTML=`<div class="lock"><div class="box">${LOGO.replace('class="logo"','class="logo" style="width:72px;height:72px"')}<h2 style="font-family:var(--fh);font-size:30px;color:var(--gold2)">${l.app}</h2><p class="small">${l.enter}</p>
 <input class="inp" id="unpin" type="password" inputmode="numeric" maxlength="8" autofocus><button class="btn gold" data-act="unlock">${l.unlock}</button><p class="small" id="lockmsg"></p></div></div>`;setTimeout(()=>{const e=document.getElementById("unpin");e&&e.focus()},50)}
async function hash(p){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("hasanat:"+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=0;for(const c of "hasanat:"+p)h=(h*31+c.charCodeAt(0))|0;return "x"+h}}
async function tryUnlock(){const e=document.getElementById("unpin");if(!e)return;if(await hash(e.value)===S.pin){unlocked=true;close();render()}else{e.value="";e.classList.remove("shake");void e.offsetWidth;e.classList.add("shake");document.getElementById("lockmsg").textContent=L().wrong}}

function askKabira(id){const l=L(),i=BY[id];modal(`<div class="modal"><h3>${i.em} ${l.recT}</h3><p style="color:var(--ink);font-weight:600;font-size:15px">${esc(nm(i))}</p>
 ${i.ref?cite(i.ref):""}<p>${l.recB}</p>${i.p==="f"||id==="harass"?`<div class="safety" style="margin:12px 0 0;font-size:12.5px">${l.safety}</div>`:""}
 <div class="row"><button class="btn" data-act="close">${l.cancel}</button><button class="btn red" data-act="dokab" data-id="${id}" style="background:rgba(255,93,108,.15)">${l.rec}</button></div></div>`)}

/* ============ actions ============ */
function setW(id,k){const d=ensure(cur),o=k==="c"?"x":"c";if(d[k][id]){delete d[k][id]}else{d[k][id]=1;delete d[o][id]}save();render()}
function bump(id,n){const d=ensure(cur);const it=BY[id];let v=(d.c[id]||0)+n;if(it.t==="wajib")v=v>0?1:0;if(v<=0){delete d.c[id];delete d.r[id]}else d.c[id]=Math.min(v,99);save();render()}

document.addEventListener("click",async e=>{
  const rf=e.target.closest("[data-ref]");if(rf){e.stopPropagation();showRef(rf.dataset.ref);return}
  if(e.target.closest("a.reflink"))return;
  const el=e.target.closest("[data-jump],[data-tri],[data-tog],[data-zk],[data-hj],[data-cat],[data-delc],[data-done],[data-miss],[data-tab],[data-lang],[data-act],[data-item],[data-minus],[data-filter],[data-rep],[data-ov]");if(!el)return;
  if(el.dataset.ov!==undefined&&e.target===el&&S.intro&&unlocked){close();return}
  if(el.dataset.ov!==undefined)return;
  if(el.dataset.tab){view=el.dataset.tab;try{history.replaceState(null,"","#"+view)}catch(_){location.hash=view}render();scrollTo({top:0,behavior:"smooth"});return}
  if(el.dataset.lang){S.lang=el.dataset.lang;save();render();return}
  if(el.dataset.minus){e.stopPropagation();bump(el.dataset.minus,-1);return}
  if(el.dataset.jump){const x=document.getElementById("area-"+el.dataset.jump);x&&x.scrollIntoView({behavior:"smooth",block:"start"});return}
  if(el.dataset.tri){e.stopPropagation&&0;cycle(el.dataset.tri);return}
  if(el.dataset.tog){const d=ensure(cur),id=el.dataset.tog;if(d.c[id])delete d.c[id];else d.c[id]=1;if(!d.c[id])delete d.r[id];save();render();return}
  if(el.dataset.zk){S.zk=S.zk||{};const y=hyear();S.zk[y]=S.zk[y]===el.dataset.zk?"":el.dataset.zk;save();render();return}
  if(el.dataset.hj){S.hajj=S.hajj===el.dataset.hj?"":el.dataset.hj;save();render();return}
  if(el.dataset.cat){S.cat=el.dataset.cat;save();render();const x=document.querySelector(".atabs");x&&x.scrollIntoView({behavior:"smooth",block:"start"});return}
  if(el.dataset.delc){const id=el.dataset.delc;S.custom=(S.custom||[]).filter(c=>c.id!==id);const ix=ITEMS.findIndex(i=>i.id===id);if(ix>=0)ITEMS.splice(ix,1);delete BY[id];save();render();return}
  if(el.dataset.done||el.dataset.miss){e.stopPropagation();setW(el.dataset.done||el.dataset.miss,el.dataset.done?"c":"x");return}
  if(el.dataset.item){const id=el.dataset.item,it=BY[id];const d=day(cur);
    if(it.t==="wajib"){setW(id,"c");return}
    if(it.t==="kabaira"){askKabira(id);return}
    bump(id,1);return}
  if(el.dataset.rep){const d=ensure(el.dataset.day||cur);const r=d.r[el.dataset.rep]||(d.r[el.dataset.rep]={});r[el.dataset.k]=!r[el.dataset.k];save();render();return}
  const a=el.dataset.act,l=L();
  if(a==="prev"){cur=shift(cur,-1);render()}
  else if(a==="next"){if(cur<dkey(new Date())){cur=shift(cur,1);render()}}
  else if(a==="close")close();
  else if(a==="goresults"){const x=document.getElementById("results");x&&x.scrollIntoView({behavior:"smooth"})}
  else if(a==="goislah"){const x=document.getElementById("tier-islah");x&&x.scrollIntoView({behavior:"smooth"})}
  else if(a==="begin"){S.intro=true;save();close()}
  else if(a==="dokab"){close();bump(el.dataset.id,1)}
  else if(a==="lock"){unlocked=false;showLock()}
  else if(a==="unlock")tryUnlock();
  else if(a==="setpin"){const v=(document.getElementById("pin").value||"").trim();if(!/^\d{4,8}$/.test(v)){toast(l.pinPh);return}S.pin=await hash(v);save();toast(l.pinSet);render()}
  else if(a==="addc"){const n=(document.getElementById("cname").value||"").trim();if(!n)return;const c={id:"c_"+Date.now(),t:document.getElementById("ctype").value,p:document.getElementById("cpil").value,n};(S.custom=S.custom||[]).push(c);regCustom(c);save();render()}
  else if(a==="rmpin"){S.pin=null;save();toast(l.pinOff);render()}
  else if(a==="copy"){const data=JSON.stringify({app:"hasanat-score",v:1,days:S.days,lang:S.lang,custom:S.custom||[],hide:S.hide||[]});
    try{await navigator.clipboard.writeText(data);toast(l.copied)}catch(_){const p=document.getElementById("paste");p.value=data;p.select();toast("⌘/Ctrl + C")}}
  else if(a==="restore")restoreFrom(document.getElementById("paste").value);
  else if(a==="erase")modal(`<div class="modal"><h3>🗑️ ${l.eraseT}</h3><p>${l.sure}</p><div class="row"><button class="btn" data-act="close">${l.cancel}</button><button class="btn red" data-act="doerase">${l.yes}</button></div></div>`);
  else if(a==="doerase"){S.days={};S.pin=null;save();close();toast(l.erased);render()}
});
function restoreFrom(txt){const l=L();try{const o=JSON.parse(txt);if(!o||typeof o.days!=="object")throw 0;S.days=o.days;if(o.lang)S.lang=o.lang;if(Array.isArray(o.custom)){S.custom=o.custom;o.custom.forEach(c=>{if(!BY[c.id])regCustom(c)})}if(Array.isArray(o.hide))S.hide=o.hide;save();toast(l.restoredOk);render()}catch(_){toast(l.invalid)}}
document.addEventListener("change",e=>{if(e.target.dataset&&e.target.dataset.hide){const id=e.target.dataset.hide;S.hide=S.hide||[];if(e.target.checked)S.hide=S.hide.filter(x=>x!==id);else if(!S.hide.includes(id))S.hide.push(id);save();return}if(e.target.id==="file"){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restoreFrom(r.result);r.readAsText(f)}});
document.addEventListener("input",e=>{if(e.target.id==="note"){ensure(cur).note=e.target.value;save()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="unpin")tryUnlock();if(e.key==="Escape"&&unlocked&&S.intro)close()});
addEventListener("hashchange",()=>{const v=location.hash.slice(1);if(["today","mizan","kabair","settings"].includes(v)&&v!==view){view=v;render()}});
render();
</script>
